[workspace]
resolver = "2"
members = [
    "crates/moly-law",
    "crates/moly-assets",
    "crates/moly-game",
    "crates/moly-app",
]

[workspace.package]
edition = "2021"
version = "0.0.1"
license = "AGPL-3.0-only"

[workspace.dependencies]
# The application adds WebGPU for its default build. The WebGL2 build omits
# that feature so the engine uses its required uniform padding and limits.
bevy = { version = "0.18.1", features = ["3d", "debug", "webgl2"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
