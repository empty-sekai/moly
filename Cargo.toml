[workspace]
resolver = "2"
members = [
    "crates/moly-law",
    "crates/moly-assets",
    "crates/moly-game",
    "crates/moly-app",
]

[workspace.package]
edition = "2021"
version = "0.0.1"
license = "AGPL-3.0-only"

[workspace.dependencies]
# The application adds WebGPU for its default build. The WebGL2 build omits
# that feature so the engine uses its required uniform padding and limits.
# Explicit expansion of Bevy 0.18's default 2d/3d/ui feature groups. Keep the
# existing renderer, audio, animation, UI, codecs and native platform support;
# omit only engine gizmos and picking. Moly owns its gesture/raycast UI routes.
bevy = { version = "0.18.1", default-features = false, features = [
    "async_executor", "bevy_asset", "bevy_input_focus", "bevy_log",
    "bevy_state", "bevy_window", "custom_cursor", "reflect_auto_register",
    "std", "android-game-activity", "android_shared_stdcxx", "bevy_gilrs",
    "bevy_winit", "default_font", "multi_threaded", "webgl2", "x11",
    "wayland", "sysinfo_plugin",
    "bevy_animation", "bevy_camera", "bevy_color", "bevy_image", "bevy_mesh",
    "bevy_shader", "bevy_text", "hdr", "png", "bevy_sprite",
    "bevy_render", "bevy_core_pipeline", "bevy_sprite_render",
    "bevy_light", "bevy_mikktspace", "ktx2", "morph_animation", "morph",
    "smaa_luts", "tonemapping_luts", "zstd_rust", "bevy_anti_alias",
    "bevy_gltf", "bevy_pbr", "bevy_post_process", "gltf_animation",
    "bevy_ui", "bevy_ui_render", "bevy_scene", "bevy_audio", "vorbis", "debug",
] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Browser size profile, measured and browser-validated. Native release is unchanged.
# Thin LTO keeps the release build reproducible on the 32 GiB review host: the
# current fat-LTO link exceeds LLVM's practical peak-memory budget, while the
# measured Brotli transfer remains no larger with thin LTO.
[profile.wasm-size]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# Diagnostic-only sibling of `wasm-size`: identical code generation, but the
# WebAssembly name section is kept so a sampling profile reports real function
# names instead of bare indices. `strip = "debuginfo"` above removes that
# section, which leaves 7,281 names for 149,011 functions — enough to make a
# profile unreadable. Never published; it exists so a hot function can be named.
[profile.wasm-names]
inherits = "wasm-size"
strip = "none"
debug = 1
