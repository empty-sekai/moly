plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.moly.game'
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }
    buildToolsVersion "37.0.0"
    // The NDK whose C++ runtime the packaged library is built against; the
    // Rust library has to be built with the same one.
    ndkVersion "30.0.16248370"

    defaultConfig {
        applicationId "dev.moly.game"
        minSdk 31
        targetSdk 37
        versionCode 1
        versionName "1.0"
        // need this otherwise it won't insert libc++_shared.so
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        // The packaged library is the arm64 build the Rust command produces.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "4.1.2"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'))
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        prefab true
    }
    // The final part to insert libc++_shared.so only
    packaging {
        jniLibs {
            excludes += '**/libdummy.so'
        }
    }
    // The game's data comes from the public asset store at runtime, so the
    // APK carries no asset directory of its own.
}

dependencies {
    // `GameActivity` and the theme the manifest names. The Java library has
    // to match the native glue that `android-activity` builds into the game
    // library: its 0.6 line registers the natives of games-activity 4.4.
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.games:games-activity:4.4.2'
}
