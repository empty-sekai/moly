plugins {
    id 'com.android.application'
}

// The Android component of `rustls-platform-verifier` has to be the exact
// version of the Rust crate in the Cargo lock file: the two agree on a JNI
// interface that may change between releases. The version is read from
// `Cargo.lock` once, at configuration time.
abstract class RustlsVersion implements ValueSource<String, RustlsVersion.Params> {
    interface Params extends ValueSourceParameters {
        RegularFileProperty getLockFile()
    }

    static final String CRATE_NAME = "rustls-platform-verifier-android"

    @Override
    String obtain() {
        def lockFile = parameters.lockFile.get().asFile
        def lines = lockFile.readLines()
        def idx = lines.findIndexOf { it.trim() == "name = \"$CRATE_NAME\"" }
        def version = idx < 0 ? null : lines.drop(idx + 1)
            .find { it.stripLeading().startsWith("version = ") }
            ?.find(/"([^"]*)"/) { match, v -> v }
        if (!version) throw new GradleException("$CRATE_NAME not found in $lockFile")
        return version
    }
}

def rustlsPlatformVerifierVersion = providers.of(RustlsVersion) { spec ->
    spec.parameters.lockFile.set(layout.projectDirectory.file('../../Cargo.lock'))
}

configurations.configureEach { configuration ->
    configuration.resolutionStrategy.eachDependency { details ->
        // The dependency is declared without a version; this rule gives it the
        // one the lock file names.
        if (details.requested.group == "org.rustls"
                && details.requested.name == "rustls-platform-verifier") {
            details.useVersion(rustlsPlatformVerifierVersion.get())
            details.because("the native component must match the Rust crate's version")
        }
    }
}

android {
    namespace 'dev.moly.game'
    compileSdk 34
    // The NDK whose C++ runtime the packaged library is built against.
    ndkVersion "27.3.13750724"

    defaultConfig {
        applicationId "dev.moly.game"
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName "1.0"
        // need this otherwise it won't insert libc++_shared.so
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        // The packaged library is the arm64 build the Rust command produces.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        prefab true
    }
    // The final part to insert libc++_shared.so only
    packagingOptions {
        exclude 'lib/*/libdummy.so'
    }
    // The game's data comes from the public asset store at runtime, so the
    // APK carries no asset directory of its own.
}

dependencies {
    // `GameActivity` and the theme the manifest names.
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.games:games-activity:2.0.2'
    // The Kotlin half of the platform verifier; its version comes from the
    // resolution rule above.
    implementation 'org.rustls:rustls-platform-verifier'
}
