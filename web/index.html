<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>moly</title>
  <style>
    /* 画布由 Rust 侧按 #app-canvas 认领。父元素高度固定，避免 resize 反馈。 */
    html, body { margin: 0; height: 100%; }
    #app-canvas { display: block; width: 100%; height: 100%; }
    #boot-panel {
      position: fixed; inset: 0; z-index: 1;
      display: grid; place-content: center; justify-items: center; gap: 1rem;
      background: #17232b; color: #f5f7f8;
      font: 1rem/1.5 system-ui, sans-serif;
    }
    #boot-panel[hidden] { display: none; }
    #boot-panel button { padding: .65rem 2rem; font: inherit; cursor: pointer; }
    #boot-start:disabled { cursor: wait; }
    #boot-status { margin: 0 1.5rem; text-align: center; white-space: pre-wrap; }
  </style>
</head>
<body>
  <canvas id="app-canvas"></canvas>
  <section id="boot-panel" aria-label="启动游戏">
    <p id="boot-status" role="status" aria-live="polite">正在加载游戏…</p>
    <button id="boot-start" type="button" aria-describedby="boot-status" disabled>开始</button>
    <button id="boot-retry" type="button" hidden>重新加载</button>
    <button id="boot-webgl" type="button" hidden>使用 WebGL2 重试</button>
  </section>
  <script type="module" src="./main.mjs"></script>
</body>
</html>
