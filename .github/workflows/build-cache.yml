name: Build cache

# Builds every release target on master so the compiler caches are saved in
# the default branch's scope, where release tags and other branches read them.
# GitHub drops a cache that has not been read for seven days, so a scheduled
# run keeps them alive between pushes.

on:
  push:
    branches: [master]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'web/build-wasm.mjs'
      - '.github/workflows/build.yml'
      - '.github/workflows/build-cache.yml'
  schedule:
    - cron: '17 3 */5 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-cache
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: Read the workspace version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      package: false
