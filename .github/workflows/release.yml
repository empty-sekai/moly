name: Release

# A version tag (v<workspace version>) builds the native programs and the
# browser package, and attaches the published targets to a draft release.
# Each native target ships two archives: the game package (game, launcher
# and server) and a server-only package for running the server on its own.
# The release notes are the tag's CHANGELOG section as git-cliff writes it
# from cliff.toml, or release-notes/<tag>.md when that file exists.
# Publishing the draft is a manual step. A manual run builds the same files
# as workflow artifacts and creates no release.
#
# The programs are built by build.yml, which reads the compiler caches that
# master runs of the build-cache workflow keep warm.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: '1.98.1'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - id: read
        name: Read the workspace version
        shell: bash
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "workspace version $version"
      - name: Match the tag to the workspace version
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "tag $TAG does not name the workspace version v$VERSION" >&2
            exit 1
          fi

  build:
    needs: [checks, version]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      package: true

  browser-package:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-stage-*
          path: stage/pkg
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-game-*
          path: game/pkg
          merge-multiple: true
      - name: Check both renderers and the font are present
        run: |
          for product in stage game; do
            test -f "$product/pkg/webgpu/build.json"
            test -f "$product/pkg/webgl2/build.json"
            test "$(find "$product/pkg/fonts" -name '*.ttf' | wc -l)" -eq 1
          done
      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/moly-$VERSION-web-stage.tar.gz" -C stage pkg
          tar -czf "dist/moly-$VERSION-web-game.tar.gz" -C game pkg
      - uses: actions/upload-artifact@v4
        with:
          name: browser
          path: dist/moly-${{ env.VERSION }}-web-*.tar.gz
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, build, browser-package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write the release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Use reviewed release notes when present
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ -f "release-notes/$TAG.md" ]]; then
            cp "release-notes/$TAG.md" RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: browser
          path: dist
      - name: Write checksums
        working-directory: dist
        run: sha256sum moly-* > SHA256SUMS && cat SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/moly-* dist/SHA256SUMS \
            --draft --verify-tag --title "moly $VERSION" --notes-file RELEASE_NOTES.md
