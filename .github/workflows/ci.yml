name: Static checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser test dependencies
        run: npm ci --prefix web --ignore-scripts
      - name: Check browser formatting
        run: npm run --prefix web format:check
      - name: Test browser protocols and resource transport
        run: npm test --prefix web
      - name: Check workspace version
        run: python tools/version/check.py
      - name: Check JavaScript syntax
        shell: bash
        run: git ls-files -z '*.mjs' | xargs -0 -r -n1 node --check
      - name: Check public source boundary
        run: node tools/boundary/check.mjs
      - name: Check commit whitespace
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [[ -n "$PR_BASE_SHA" ]]; then
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          elif [[ -n "$PUSH_BASE_SHA" && ! "$PUSH_BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$PUSH_BASE_SHA" "$GITHUB_SHA"
          else
            git show --format= --check "$GITHUB_SHA"
          fi
