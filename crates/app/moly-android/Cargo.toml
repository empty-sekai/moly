[package]
name = "moly-android"
version.workspace = true
edition.workspace = true
license.workspace = true

# The Android entry point: the game and its server in one process. The APK
# carries no game data; the assets stream from the public store into an
# app-private cache, and the player's documents stay in the app's own data
# directory. Every item is behind `target_os = "android"`, so elsewhere the
# crate builds an empty library.
[lib]
name = "moly_android"
crate-type = ["cdylib"]

[dependencies]
bevy = { workspace = true }
moly-app = { path = "../moly-app" }
moly-assets = { path = "../../engine/moly-assets" }
moly-server = { path = "../../server/moly-server" }
moly-server-host = { path = "../moly-server-host" }
moly-store = { path = "../../base/moly-store" }

[target.'cfg(target_os = "android")'.dependencies]
# The platform certificate verifier: Android's own trust store validates the
# store's HTTPS requests. `jni` is the version the verifier's Android module
# is built against.
rustls-platform-verifier = "0.7"
jni = "0.22"
# The panic hook writes to logcat; Bevy's own logger does the same for the
# game's messages.
android_log-sys = "0.3"
