[package]
name = "moly-android"
version.workspace = true
edition.workspace = true
license.workspace = true

# The Android entry point: the game, which connects to a server elsewhere. The
# APK carries no game data; the assets stream from the public store into an
# app-private cache. Every item is behind `target_os = "android"`, so
# elsewhere the crate builds an empty library.
[lib]
name = "moly_android"
crate-type = ["cdylib"]

[dependencies]
bevy = { workspace = true }
moly-app = { path = "../moly-app" }
moly-store = { path = "../../base/moly-store" }

[target.'cfg(target_os = "android")'.dependencies]
# The panic hook writes to logcat; Bevy's own logger does the same for the
# game's messages.
android_log-sys = "0.3"
# The audio backend links the C++ runtime the APK packages
# (`libc++_shared.so`) instead of a static copy of its own, so the process has
# one C++ runtime.
bevy = { workspace = true, features = ["android_shared_stdcxx"] }
