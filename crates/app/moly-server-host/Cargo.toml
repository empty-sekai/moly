[package]
name = "moly-server-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "moly_server_host"
path = "src/lib.rs"

[[bin]]
name = "moly-server"
path = "src/main.rs"

[dependencies]
moly-server = { path = "../../server/moly-server", features = ["control"] }
moly-assets = { path = "../../engine/moly-assets", default-features = false }
# The control port: bevy_remote's JSON-RPC server over HTTP.
bevy_remote = { version = "0.20.1", default-features = false, features = ["http"] }
bevy = { version = "0.20.1", default-features = false, features = ["std", "bevy_asset", "bevy_log", "async_executor", "multi_threaded"] }
