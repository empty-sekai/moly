[package]
name = "moly-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["webgpu"]
webgpu = ["bevy/webgpu"]
webgl2 = ["bevy/webgl2"]

[dependencies]
bevy = { workspace = true }
moly-assets = { path = "../../engine/moly-assets" }
moly-game = { path = "../../game/moly-game" }
moly-perf = { path = "../../engine/moly-perf" }
moly-store = { path = "../../base/moly-store" }
# The game connects to its server over one HTTP endpoint, natively and in the
# browser.
moly-link = { path = "../../net/moly-link" }
moly-protocol = { path = "../../net/moly-protocol" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# 钉精确版本随本机 wasm-bindgen CLI：CLI 拒绝 schema 版本不一致的输入，
# 而报法是一段多行 schema 文案，不直说版本不匹配。升级时 CLI 与这里的钉
# 一起动（cargo install wasm-bindgen-cli --version X），别单改一头。
wasm-bindgen = "=0.2.127"
# wasm 的 panic 默认只剩一句 RuntimeError；资产源的拒绝要整句落进控制台。
console_error_panic_hook = "0.1"
# The browser stage hosts the server in its own app.
moly-link = { path = "../../net/moly-link", features = ["local"] }
# Browser startup events and same-origin page parameters.
web-sys = { version = "0.3", features = ["Window", "Location", "UrlSearchParams", "Navigator", "Event", "EventTarget", "CustomEvent", "CustomEventInit", "Url", "Storage", "Crypto"] }
js-sys = "0.3"
# The control export answers a Promise.
wasm-bindgen-futures = "0.4"
# The global allocator's heap; its system layer is the crate's own (src/wasm_heap.rs).
dlmalloc = "0.2"
