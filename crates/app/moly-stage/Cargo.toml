[package]
name = "moly-stage"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["webgpu"]
webgpu = ["bevy/webgpu"]
webgl2 = ["bevy/webgl2"]

[dependencies]
bevy = { workspace = true }
moly-core = { path = "../../game/moly-core", features = ["browser-heap"] }
moly-render = { path = "../../game/moly-render" }
moly-audio = { path = "../../game/moly-audio" }
moly-ui = { path = "../../game/moly-ui" }
moly-world = { path = "../../game/moly-world" }
moly-features = { path = "../../game/moly-features" }
moly-assets = { path = "../../engine/moly-assets" }
moly-perf = { path = "../../engine/moly-perf" }
moly-link = { path = "../../net/moly-link", features = ["local"] }
moly-protocol = { path = "../../net/moly-protocol" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Location", "UrlSearchParams", "Navigator", "Event", "EventTarget", "CustomEvent", "CustomEventInit", "Url"] }
