[package]
name = "moly-assets"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
moly-law = { path = "../../base/moly-law" }
bevy = { workspace = true }
gltf = { version = "1.4", default-features = false }
# 清单类提取产物（manifest.json / characters.json）与站点 sidecar 的解析；
# schema 归本 crate 的 character/sidecar 模块，解析只发生在装载边界这一次。
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
async-lock = "3"
flate2 = "1"
futures-lite = "2"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native remote reads (`remote`): the whole transfer runs on the blocking
# thread pool with bounded waits, through the client Bevy's web reader uses.
blocking = "1.6"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "WorkerGlobalScope", "AbortController", "AbortSignal", "ReadableStream", "ReadableStreamDefaultReader", "Request", "RequestInit", "RequestMode", "RequestRedirect", "RequestCredentials", "Response", "ResponseType", "Headers"] }
