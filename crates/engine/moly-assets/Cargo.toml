[package]
name = "moly-assets"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["render"]
# The renderer-side asset types: glTF scenes, images and shader programs. A
# headless consumer (the server) builds this crate without it.
render = ["bevy/bevy_gltf", "bevy/bevy_image", "bevy/bevy_scene", "bevy/bevy_shader"]

[dependencies]
moly-law = { path = "../../base/moly-law" }
bevy = { version = "0.19.1", default-features = false, features = [
    "std", "bevy_asset", "bevy_log", "async_executor", "multi_threaded",
] }
gltf = { version = "1.4", default-features = false }
# 清单类提取产物（manifest.json / characters.json）与站点 sidecar 的解析；
# schema 归本 crate 的 character/sidecar 模块，解析只发生在装载边界这一次。
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
async-lock = "3"
flate2 = "1"
futures-lite = "2"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native remote reads (`remote`): the whole transfer runs on the blocking
# thread pool with bounded waits; the agents take moly-store's TLS settings.
blocking = "1.6"
# The native asset root falls back to the resources the launcher installed.
moly-store = { path = "../../base/moly-store" }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser's fetch-based web reader (`remote`).
bevy = { version = "0.19.1", default-features = false, features = ["https"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "WorkerGlobalScope", "AbortController", "AbortSignal", "ReadableStream", "ReadableStreamDefaultReader", "Request", "RequestInit", "RequestMode", "RequestRedirect", "RequestCredentials", "Response", "ResponseType", "Headers"] }
