[package]
name = "moly-content-library"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
moly-core = { path = "../moly-core" }
moly-features = { path = "../moly-features" }
moly-law = { path = "../../base/moly-law" }
moly-assets = { path = "../../engine/moly-assets" }
moly-config = { path = "../../base/moly-config" }
bevy = { workspace = true }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Navigator", "Clipboard"] }

[lints]
workspace = true
