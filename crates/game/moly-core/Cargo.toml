[package]
name = "moly-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
moly-assets = { path = "../../engine/moly-assets" }
moly-store = { path = "../../base/moly-store" }
bevy = { workspace = true }
serde_json = { workspace = true }
# The world seed draws the platform's random source: OS entropy natively and
# JS crypto on wasm; already locked, no new download.
getrandom = { version = "=0.2.17", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Each settings write is a synced temporary file replaced into place.
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browser console diagnostics without an unbounded User Timing recording.
tracing-wasm = "0.2.1"
# Frame captures are stamped with the page clock (std's SystemTime is a stub
# on wasm). Already locked, no new download.
js-sys = "0.3"
# The browser side of the settings document and the world seed: localStorage
# and the page's query string. Same version source as the application.
web-sys = { version = "0.3", features = ["Window", "Storage", "Location", "UrlSearchParams"] }
