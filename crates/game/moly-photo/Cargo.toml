[package]
name = "moly-photo"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
moly-features = { path = "../moly-features" }
moly-law = { path = "../../base/moly-law" }
moly-assets = { path = "../../engine/moly-assets" }
bevy = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
zip = { version = "9.1", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Blob", "BlobPropertyBag", "Url", "Document", "HtmlElement", "Element", "Node"] }

[lints]
workspace = true
