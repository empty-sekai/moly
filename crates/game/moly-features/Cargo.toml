[package]
name = "moly-features"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
moly-core = { path = "../moly-core" }
moly-render = { path = "../moly-render" }
moly-audio = { path = "../moly-audio" }
moly-ui = { path = "../moly-ui" }
moly-world = { path = "../moly-world" }
moly-protocol = { path = "../../net/moly-protocol" }
moly-link = { path = "../../net/moly-link" }
moly-layout = { path = "../../net/moly-layout" }
moly-masters = { path = "../moly-masters" }
moly-law = { path = "../../base/moly-law" }
moly-assets = { path = "../../engine/moly-assets" }
moly-perf = { path = "../../engine/moly-perf" }
moly-store = { path = "../../base/moly-store" }
bevy = { workspace = true }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# 字形光栅化与度量：bevy_text 的同源光栅器，锁内已有 0.2.10，不新增下载。
swash = "0.2.10"
async-lock = "3"
futures-util = "0.3"
futures-channel = "0.3"
# Shared particle seed owner: already locked; OS entropy on native and JS crypto on wasm.
getrandom = { version = "=0.2.17", features = ["js"] }
# Source MeshCollider.convex is a solid 3-D hull, not its concave render mesh.
# Use the geometry implementation without physics dynamics or triangulation extras.
parry3d = { version = "0.31.1", default-features = false, features = ["required-features", "std", "alloc"] }
# Room skin texture names are .NET regex patterns from the server config
# (FindAssetByPattern); already locked through naga_oil, no new download.
regex = "1"
# Record audio from the storage host: its sha256 is checked against the
# record sidecar, and it is decoded once (the engine's own decoder panics on
# a file it cannot read) before a player gets it. Both already locked.
sha2 = "0.10"
rodio = { version = "0.20.1", default-features = false, features = ["mp3"] }
# The control surface: Bevy Remote Protocol without a transport on every
# target (the browser page sends through the mailbox), plus its localhost
# HTTP endpoint on native. Captured frames are answered as base64 PNG.
bevy_remote = { version = "0.18.1", default-features = false }
async-channel = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy_remote = { version = "0.18.1", default-features = false, features = ["http"] }
arboard = { version = "3", default-features = false }
# Fixture clocks read the device's local clock (localtime_r / localtime_s);
# already locked, no new download.
libc = "0.2"
tempfile = "3"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time", "net", "fs", "io-util"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tracing-wasm = "0.2.1"
# 生日门要读墙钟的 epoch 毫秒；wasm 上 std 的 SystemTime 是未实现的桩
# （sys/pal/unsupported：SystemTime::now() 运行时 panic），epoch 走 JS 的
# Date.now。版本与 moly-app 同源（锁内 0.3.104，不新增下载）。
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# 本地档（音量设置持久化）在浏览器侧落 localStorage：Window + Storage
# 绑定。与 moly-app 同一版本源（锁内已有，不新增下载）。
web-sys = { version = "0.3", features = ["Window", "Storage", "Location", "UrlSearchParams", "Navigator", "Clipboard", "File", "Blob", "FileList", "Document", "HtmlInputElement", "HtmlElement", "Element", "Node", "Event", "EventTarget", "AbortController", "AbortSignal", "ReadableStream", "ReadableStreamDefaultReader", "Request", "RequestInit", "RequestRedirect", "Response", "Headers", "ResizeObserver", "DragEvent", "DataTransfer"] }

[dev-dependencies]
moly-core = { path = "../moly-core", features = ["test-support"] }
moly-render = { path = "../moly-render", features = ["test-support"] }
moly-audio = { path = "../moly-audio", features = ["test-support"] }
moly-ui = { path = "../moly-ui", features = ["test-support"] }
moly-world = { path = "../moly-world", features = ["test-support"] }
# Compile the actual depth-sampling helper to GLSL ES before a WASM rebuild.
naga = { version = "27", features = ["wgsl-in", "glsl-out"] }

[features]
# Test helpers that the higher layers' tests call.
test-support = []
