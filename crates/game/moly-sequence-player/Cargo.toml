[package]
name = "moly-sequence-player"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
moly-features = { path = "../moly-features" }
moly-audio = { path = "../moly-audio" }
moly-sequence = { path = "../../base/moly-sequence" }
bevy = { workspace = true }
serde_json = "1"

# The sequence's methods join the control surface's protocol table, which
# native runs have.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy_remote = { version = "0.20.1", default-features = false }
