[package]
name = "moly-ragdoll"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
moly-features = { path = "../moly-features" }
bevy = { workspace = true }
avian3d = { workspace = true }
serde_json = "1"

[lints]
workspace = true

# Extra multithreading pays off for a whole crowd of ragdolls and is not built
# for the browser.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
avian3d = { workspace = true, features = ["parallel"] }
# The ragdoll's methods join the control surface's protocol table, which
# native runs have.
bevy_remote = { version = "0.20.1", default-features = false }
