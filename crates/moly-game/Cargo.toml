[package]
name = "moly-game"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
moly-law = { path = "../moly-law" }
moly-assets = { path = "../moly-assets" }
bevy = { workspace = true }
serde_json = "1"
# 字形光栅化与度量：bevy_text 的同源光栅器，锁内已有 0.2.10，不新增下载。
swash = "0.2.10"
async-lock = "3"
futures-util = "0.3"
futures-channel = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3", default-features = false }
tempfile = "3"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time", "net", "fs", "io-util"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# 生日门要读墙钟的 epoch 毫秒；wasm 上 std 的 SystemTime 是未实现的桩
# （sys/pal/unsupported：SystemTime::now() 运行时 panic），epoch 走 JS 的
# Date.now。版本与 moly-app 同源（锁内 0.3.104，不新增下载）。
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# 本地档（音量设置持久化）在浏览器侧落 localStorage：Window + Storage
# 绑定。与 moly-app 同一版本源（锁内已有，不新增下载）。
web-sys = { version = "0.3", features = ["Window", "Storage", "Location", "UrlSearchParams", "Navigator", "Clipboard", "File", "Blob", "FileList", "Document", "HtmlInputElement", "HtmlElement", "Element", "Node", "Event", "EventTarget", "AbortController", "AbortSignal", "ReadableStream", "ReadableStreamDefaultReader", "Request", "RequestInit", "RequestRedirect", "Response", "Headers"] }
