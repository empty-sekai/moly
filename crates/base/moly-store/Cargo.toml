[package]
name = "moly-store"
version.workspace = true
edition.workspace = true
license.workspace = true

# The local resource store: where moly keeps downloaded resources, the
# publication document that lists them, and the installer that mirrors one
# published catalog. No engine dependency, so the launcher and the game read
# the same locations and records.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"

# HTTPS through rustls with the bundled WebPKI roots (`tls`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Program updates (`update`): release archives, versions and self-replacement.
flate2 = "1"
self-replace = "1"
semver = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
