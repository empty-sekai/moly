# Shared build cache. This repo and its sibling worktrees sit two levels below
# the cache directory, so the same relative path resolves there from any of
# them; registry dependencies then build once for all trees instead of once
# per tree.
#
# incremental = false: the cache is shared by every checkout of this repo.
# rustc keys incremental sessions by crate name only, so a session written by
# one checkout is reused by another whose sources differ — that produces
# archives mixing fresh metadata with stale object code, which then link into
# binaries that silently omit whole modules. Rebuilding from scratch every
# time is slower per edit but keeps every binary honest.
[build]
target-dir = "../../shared-target"
incremental = false
